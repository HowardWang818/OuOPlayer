name: ouoplayer
description: "OuOPlayer - a Spotify-style music player for Android and Windows."
publish_to: 'none'
version: 1.14.3+80

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  audio_session: ^0.2.4
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.4
  audio_metadata_reader: ^1.8.1
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.1
  xml: ^7.1.0
  archive: ^4.5.2
  crypto: ^3.0.7
  # Already used by audio_service; Android Auto content-change notifications.
  rxdart: ^0.28.0
  url_launcher: ^6.3.3
  rapidfuzz: ^0.1.1
  media_kit_libs_windows_video: ^1.0.11
  google_sign_in: ^7.2.0
  tray_manager: 0.5.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.0

dependency_overrides:
  # Patched copy that lets us set mpv's audio filter (volume normalization on Windows).
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  # Patched copy: keyboard media keys reach the app (windows/audio_service_win_plugin.cpp).
  audio_service_win:
    path: third_party/audio_service_win

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Makes the app icons from assets/icon (drawn by assets/icon/make_icon.py):
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # The two choices in 設定 → 關於與更新 → App 圖示.
    - assets/icon/app_icon_dark.png
    - assets/icon/app_icon_light.png
    - assets/icon/tray.ico
  fonts:
    # Windows: song titles and artists (設定 → 播放 → 歌名字體).
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-VF.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#10151C"
  adaptive_icon_foreground: assets/icon/foreground.png
  # The drawing is already sized for the adaptive icon's safe zone.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
