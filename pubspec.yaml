name: ouoplayer
description: "OuOPlayer - a Spotify-style music player for Android and Windows."
publish_to: 'none'
version: 0.3.0+6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  audio_session: ^0.2.4
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.4
  audio_metadata_reader: ^1.8.1
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.11.1
  xml: ^7.1.0
  archive: ^4.5.2
  crypto: ^3.0.7
  url_launcher: ^6.3.3

dependency_overrides:
  # Patched copy that lets us set mpv's audio filter (volume normalization on Windows).
  just_audio_media_kit:
    path: third_party/just_audio_media_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
