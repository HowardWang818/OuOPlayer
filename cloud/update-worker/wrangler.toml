# OuOPlayer update server: hands the app latest.json and APKs from the
# private R2 bucket. Deploy from this folder with `npx wrangler deploy`.
# Stays on the Workers Free plan: over 100,000 requests a day it stops
# answering instead of billing, which also caps R2 reads in the free tier.
name = "cdn"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "UPDATES"
bucket_name = "ouoplayer-updates"

# Per IP address, per minute.
[[ratelimits]]
name = "CHECK_LIMIT"
namespace_id = "18001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "APK_LIMIT"
namespace_id = "18002"
simple = { limit = 3, period = 60 }
