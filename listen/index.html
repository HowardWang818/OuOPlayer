<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OuOPlayer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101418; color: #e6e9ec;
         font-family: system-ui, -apple-system, "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .song { font-size: 18px; margin: 16px 0 4px; word-break: break-word; }
  .artist { color: #9aa4ad; margin: 0 0 24px; word-break: break-word; }
  a.button { display: inline-block; padding: 10px 22px; border-radius: 999px; background: #29b6f6; color: #06121a;
             font-weight: 600; text-decoration: none; margin: 4px; }
  a.plain { color: #9aa4ad; }
  #missing { display: none; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>OuOPlayer</h1>
  <p class="song" id="song"></p>
  <p class="artist" id="artist"></p>
  <a class="button" id="open" href="#">打開 OuOPlayer</a>
  <p id="missing">沒有安裝 OuOPlayer？<br><a class="plain" href="https://github.com/HowardWang818/OuOPlayer/releases/latest">下載 OuOPlayer</a></p>
</main>
<script>
// Discord's "Open OuOPlayer" button comes here (OuOPlayer 1.21.0): the app
// opens and plays the song (or searches for it); without the app, GitHub.
(function () {
  var q = new URLSearchParams(location.search);
  var params = new URLSearchParams();
  var t = (q.get('t') || '').trim(), a = (q.get('a') || '').trim(), ms = (q.get('ms') || '').trim();
  if (t) params.set('t', t);
  if (a) params.set('a', a);
  if (/^\d+$/.test(ms)) params.set('ms', ms);
  document.getElementById('song').textContent = t;
  document.getElementById('artist').textContent = a;

  var github = 'https://github.com/HowardWang818/OuOPlayer/releases/latest';
  var android = /Android/i.test(navigator.userAgent);
  var windows = /Windows/i.test(navigator.userAgent);
  var link = android
    ? 'intent://play?' + params + '#Intent;scheme=ouoplayer;package=com.ouo.ouoplayer;S.browser_fallback_url=' + encodeURIComponent(github) + ';end'
    : 'ouoplayer://play?' + params;
  var button = document.getElementById('open');
  button.href = link;

  if (!android && !windows) { location.replace(github); return; }
  if (!t) return;

  // The app took it when the page loses focus or goes to the back
  // (Windows: the browser's "open OuOPlayer?" question counts too).
  var left = false;
  function gone() { left = true; }
  window.addEventListener('blur', gone);
  document.addEventListener('visibilitychange', function () { if (document.hidden) gone(); });

  location.href = link;
  if (android) return; // Android goes to GitHub by itself when the app isn't there
  setTimeout(function () {
    if (left) return;
    document.getElementById('missing').style.display = 'block';
    location.href = github;
  }, 2500);
})();
</script>
</body>
</html>
